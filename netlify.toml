# Netlify Configuration for AI Interview Assistant
# Reference: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Directory that contains the deploy-ready HTML files and assets
  publish = "frontend"

  # Injects VITE_API_URL / API_URL environment variable into frontend/config.js
  command = "node build.js"

# Security and caching headers for static assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Single-Page Application (SPA) fallback to ensure index.html handles direct routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

