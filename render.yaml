# Render Blueprint configuration for InterviewAI Node.js / Express Backend
# Reference: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-interview-assistant-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_REFRESH_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: CLIENT_URL
        sync: false
